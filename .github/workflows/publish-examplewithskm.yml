name: Build ExampleWithSKM and attach release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild example assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build the API-matched example and starter
        run: |
          set -euo pipefail
          tasks=(--no-daemon :examplewithskm:clean :examplewithskm:build)
          if [[ -d examples/plugin-template ]]; then
            tasks+=( :plugin-template:clean :plugin-template:build )
          fi
          bash ./gradlew "${tasks[@]}"

      - name: Package version-matched source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          git archive --format=zip \
            --prefix="examplewithskm-source-${version}/" \
            HEAD examples/examplewithskm \
            > "$RUNNER_TEMP/release-assets/examplewithskm-source-${version}.zip"
          cp examples/examplewithskm/build/libs/examplewithskm.jar "$RUNNER_TEMP/release-assets/examplewithskm.jar"
          if [[ -d examples/plugin-template ]]; then
            git archive --format=zip \
              --prefix="skm-plugin-template-${version}/" \
              HEAD examples/plugin-template \
              > "$RUNNER_TEMP/release-assets/skm-plugin-template-${version}.zip"
          fi

      - name: Upload example JAR and source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "$RUNNER_TEMP/release-assets/examplewithskm.jar"
            "$RUNNER_TEMP/release-assets/examplewithskm-source-${version}.zip"
          )
          template_zip="$RUNNER_TEMP/release-assets/skm-plugin-template-${version}.zip"
          if [[ -f "$template_zip" ]]; then assets+=("$template_zip"); fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber

      - name: Rebuild SHA256SUMS for all release JAR and ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/all-release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern '*.jar' --pattern '*.zip' --dir "$asset_dir" --clobber
          cd "$asset_dir"
          sha256sum -- *.jar *.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$REPOSITORY" --clobber

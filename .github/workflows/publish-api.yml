name: Publish SKM API to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Publish API to GitHub Packages
        run: bash ./gradlew :skm-api:publish --no-daemon
        env:
          SKM_MAVEN_URL: https://maven.pkg.github.com/vcyte/skm
          SKM_MAVEN_USERNAME: ${{ github.actor }}
          SKM_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

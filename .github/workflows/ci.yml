name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build and test the full repository
        run: bash ./gradlew --no-daemon clean build :skm-api:publishToMavenLocal

      - name: Verify the copied starter builds independently
        run: |
          cd examples/plugin-template
          bash ./gradlew --no-daemon clean build

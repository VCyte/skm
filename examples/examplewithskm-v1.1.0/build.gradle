plugins {
    id 'java'
}

group = 'tmin.click.examples'
def skmVersion = providers.gradleProperty('skmVersion').getOrElse('1.1.0')
version = skmVersion

base {
    archivesName = 'examplewithskm'
}

repositories {
    mavenLocal()
    maven {
        name = 'githubPackages'
        url = uri('https://maven.pkg.github.com/vcyte/skm')
        def githubUser = providers.gradleProperty('gpr.user')
                .orElse(providers.environmentVariable('GITHUB_ACTOR')).orNull
        def githubToken = providers.gradleProperty('gpr.key')
                .orElse(providers.environmentVariable('GITHUB_TOKEN')).orNull
        if (githubUser != null && githubToken != null) {
            credentials {
                username = githubUser
                password = githubToken
            }
        }
    }
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    compileOnly "tmin.click:skm-api:${skmVersion}"
    compileOnly 'io.papermc.paper:paper-api:26.2.build.124-stable'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveFileName = 'examplewithskm.jar'
}

tasks.processResources {
    inputs.property('version', skmVersion)
    filesMatching('plugin.yml') {
        expand(version: skmVersion)
    }
}
